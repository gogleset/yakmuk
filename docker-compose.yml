# BE(Supabase)는 `supabase start`로 별도 기동.
# 이 compose는 앱(Expo Metro) 컨테이너만 올린다.
services:
  yakmuk:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: yakmuk
    ports:
      # 호스트에서 이미 `pnpm start` 중이면 8081 충돌 → 그 프로세스 종료 후 기동
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      # 소스 핫리로드 (node_modules는 이미지/볼륨 유지)
      - ./mobile:/app
      - yakmuk_node_modules:/app/node_modules
    env_file:
      - ./mobile/.env
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: "0.0.0.0"
      CI: "1"
      # 실기기 QR이 호스트 IP를 쓰도록 (Docker Desktop)
      REACT_NATIVE_PACKAGER_HOSTNAME: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true

volumes:
  yakmuk_node_modules:
